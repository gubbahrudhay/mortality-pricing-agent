# deployment/streamlit_config.toml
# Copy this file to .streamlit/config.toml to activate the dark theme configuration

[theme]
primaryColor = "#6366f1"       # Indigo accent
backgroundColor = "#0f0f1b"    # Premium dark background
secondaryBackgroundColor = "#1e1e38" # Slightly lighter dark surface
textColor = "#f8fafc"          # White text
font = "sans serif"

[server]
port = 8501
enableCORS = false
enableXsrfProtection = false
